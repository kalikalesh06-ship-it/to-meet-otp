
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TO MEET</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf2ff;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 360px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      font-size: 16px;
    }
    button {
      background: #1769e0;
      color: white;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card" id="login">
    <h2>TO MEET</h2>
    <p>Login with your phone number</p>
    <input id="phone" type="tel" placeholder="+91XXXXXXXXXX">
    <div id="recaptcha-container"></div>
    <button id="send">Send OTP</button>
    <input id="otp" inputmode="numeric" placeholder="Enter OTP">
    <button id="verify">Verify OTP</button>
    <p id="message"></p>
  </div>

  <div class="card" id="home" hidden>
    <h2>Welcome to TO MEET!</h2>
    <p>Login successful.</p>
    <p>Your Home Page is ready.</p>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, RecaptchaVerifier, signInWithPhoneNumber
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyABoKiDmy2kx_rdiDkbjqBARgU5cmphvGg",
      authDomain: "to-meet-e11eb.firebaseapp.com",
      projectId: "to-meet-e11eb",
      storageBucket: "to-meet-e11eb.firebasestorage.app",
      messagingSenderId: "103784656631",
      appId: "1:103784656631:web:15670401770f8ac5536df2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const message = document.getElementById("message");
    let confirmation = null;
    let verifier;

    try {
      verifier = new RecaptchaVerifier(auth, "recaptcha-container", {
        size: "normal"
      });
      await verifier.render();
    } catch (e) {
      message.textContent = "reCAPTCHA error: " + e.message;
    }

    document.getElementById("send").onclick = async () => {
      const phone = document.getElementById("phone").value.trim();
      if (!phone.startsWith("+")) {
        message.textContent = "Enter country code, e.g. +91...";
        return;
      }
      try {
        message.textContent = "Sending OTP...";
        confirmation = await signInWithPhoneNumber(auth, phone, verifier);
        message.textContent = "OTP sent. Check your phone.";
      } catch (e) {
        message.textContent = "OTP error: " + e.code + " - " + e.message;
      }
    };

    document.getElementById("verify").onclick = async () => {
      if (!confirmation) {
        message.textContent = "Tap Send OTP first.";
        return;
      }
      try {
        await confirmation.confirm(
          document.getElementById("otp").value.trim()
        );
        document.getElementById("login").hidden = true;
        document.getElementById("home").hidden = false;
      } catch (e) {
        message.textContent = "Verification error: " + e.code + " - " + e.message;
      }
    };
  </script>
</body>
</html>
